# =============================================================================
#  NEXUS-OMEGA v5.2 - Master Configuration Example
# =============================================================================

# Supported Roles: "reverse-server" (Iran), "reverse-client" (Kharej), "server", "client"
role = "reverse-server"

[server]
bind_addr = "0.0.0.0:3080"
token = "YOUR_SUPER_SECRET_TOKEN"
fake_sni = "speed.cloudflare.com"
heartbeat = 12
nodelay = true
enable_udp = true
mux_framesize = 32768
mss_clamp = 1360
ports = [
    "443=127.0.0.1:443",
    "8443=127.0.0.1:8443",
    "80=127.0.0.1:80",
    "2083=127.0.0.1:2083",
    "2087=127.0.0.1:2087",
    "2096=127.0.0.1:2096"
]

[client]
remote_addr = "IRAN_IP:3080"
token = "YOUR_SUPER_SECRET_TOKEN"
fake_sni = "speed.cloudflare.com"
connection_pool = 8
heartbeat = 12
retry_interval = 2
nodelay = true
enable_udp = true
mux_framesize = 32768
mss_clamp = 1360
ports = [
    "443=127.0.0.1:443",
    "8443=127.0.0.1:8443"
]

[polymorph]
enable_port_hopping = true
hop_port_min = 30000
hop_port_max = 50000
hop_interval = 300
sni_list = [
    "speed.cloudflare.com",
    "dl.google.com",
    "www.microsoft.com",
    "cdn.jsdelivr.net",
    "gateway.icloud.com"
]

[ai]
enabled = true
gemini_api_key = "YOUR_GEMINI_API_KEY"
model = "gemini-flash-lite-latest"
api_endpoint = "https://generativelanguage.googleapis.com"
check_interval = 30
