name: Build and Release Nexus-Tunnel v7.0

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries (amd64 & arm64)
        run: |
          make build-amd64
          make build-arm64
          sha256sum nexus-tunnel-linux-* > checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus-tunnel-linux-amd64
            nexus-tunnel-linux-arm64
            checksums.txt
